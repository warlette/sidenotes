<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideNotes Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body class="impeccable-theme">
  <!-- Subtle Impeccable Grain Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <div class="app-container" id="app">
    <!-- Top Bar Navigation -->
    <header class="top-bar">
      <div class="brand">
        <button id="toggle-list-btn" class="icon-btn" title="Toggle Notes Drawer (Alt+S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <div class="logo">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path d="M5 2.5 L13.5 2.5 L5.5 21.5 L5 21.5 Q2.5 21.5 2.5 19 L2.5 5 Q2.5 2.5 5 2.5 Z"></path>
              <path d="M16.5 2.5 L19 2.5 Q21.5 2.5 21.5 5 L21.5 19 Q21.5 21.5 19 21.5 L8.5 21.5 Z"></path>
            </svg>
          </span>
          <span class="logo-text">SideNotes</span>
          <span class="logo-badge">WM</span>
        </div>
      </div>

      <div class="top-actions">
        <button id="quick-clip-btn" class="btn btn-accent btn-sm" title="Capture active tab title & URL">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>Clip Page</span>
        </button>
        <button id="new-note-btn" class="btn btn-primary btn-sm" title="Create New Note (Alt+N)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New</span>
        </button>
        <button id="settings-open-btn" class="icon-btn" title="Sync & Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">
          <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Grid -->
    <div class="workspace">
      <!-- Left Drawer: Notes List & Filter -->
      <aside class="notes-drawer" id="notes-drawer">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search notes..." autocomplete="off">
          <button id="clear-search-btn" class="clear-btn hidden">&times;</button>
        </div>

        <div class="filter-pills">
          <select id="category-filter" class="select-pill">
            <option value="ALL">All Categories</option>
            <option value="General">General</option>
            <option value="Research">Research</option>
            <option value="Ideas">Ideas</option>
            <option value="Todo">Todo</option>
            <option value="Web Snippets">Web Snippets</option>
          </select>
          <button id="pinned-filter-btn" class="pill-btn" title="Filter Pinned Notes">
            ★ Pinned
          </button>
        </div>

        <div class="notes-list" id="notes-list">
          <!-- Dynamically populated note cards -->
        </div>

        <div class="drawer-footer">
          <button id="import-btn" class="btn-link">📥 Import</button>
          <button id="export-all-btn" class="btn-link">📤 Export All</button>
        </div>
      </aside>

      <!-- Right Editor Workspace -->
      <main class="editor-container">
        <!-- Editor Header Info -->
        <div class="editor-header">
          <div class="title-row">
            <input type="text" id="note-title-input" class="note-title-input" placeholder="Note Title...">
            <button id="pin-note-btn" class="icon-btn star-btn" title="Pin Note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                </polygon>
              </svg>
            </button>
          </div>

          <div class="meta-row">
            <select id="note-category-select" class="meta-select">
              <option value="General">General</option>
              <option value="Research">Research</option>
              <option value="Ideas">Ideas</option>
              <option value="Todo">Todo</option>
              <option value="Web Snippets">Web Snippets</option>
            </select>
            <input type="text" id="note-tags-input" class="meta-tags-input"
              placeholder="Tags (comma separated, e.g. web, code)">
          </div>

          <!-- Markdown Toolbar -->
          <div class="toolbar">
            <div class="toolbar-group">
              <button class="tb-btn" data-action="bold" title="Bold (**text**)"><b>B</b></button>
              <button class="tb-btn" data-action="italic" title="Italic (*text*)"><i>I</i></button>
              <button class="tb-btn" data-action="strike" title="Strikethrough (~~text~~)"><s>S</s></button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
              <button class="tb-btn" data-action="h1" title="Heading 1">H1</button>
              <button class="tb-btn" data-action="h2" title="Heading 2">H2</button>
              <button class="tb-btn" data-action="h3" title="Heading 3">H3</button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
              <button class="tb-btn" data-action="ul" title="Bullet List">• List</button>
              <button class="tb-btn" data-action="checklist" title="Checklist">☑ List</button>
              <button class="tb-btn" data-action="quote" title="Quote">“ ”</button>
              <button class="tb-btn" data-action="code" title="Code Block">&lt;/&gt;</button>
              <button class="tb-btn" data-action="link" title="Link">[Link](url)</button>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
              <button id="insert-active-link-btn" class="tb-btn tb-accent" title="Insert current active tab link">
                🔗 Insert Page Link
              </button>
            </div>
            <div class="toolbar-spacer"></div>
            <div class="mode-toggle">
              <button id="edit-mode-btn" class="mode-btn active">Write</button>
              <button id="preview-mode-btn" class="mode-btn">Preview</button>
            </div>
          </div>
        </div>

        <!-- Editor & Preview Body -->
        <div class="editor-body">
          <textarea id="note-editor" class="editor-textarea"
            placeholder="Start typing your note here... Markdown is supported!"></textarea>
          <div id="note-preview" class="editor-preview hidden"></div>
        </div>

        <!-- Editor Footer -->
        <div class="editor-footer">
          <div class="stats-info">
            <span id="word-count">0 words</span>
            <span class="dot-separator">•</span>
            <span id="char-count">0 chars</span>
            <span class="dot-separator">•</span>
            <span id="save-status" class="save-status">Saved</span>
          </div>

          <div class="footer-actions">
            <button id="copy-note-btn" class="btn btn-secondary btn-sm" title="Copy Raw Note Text">📋 Copy</button>
            <div class="dropdown">
              <button id="export-dropdown-btn" class="btn btn-secondary btn-sm">Export ▼</button>
              <div id="export-menu" class="dropdown-menu hidden">
                <button id="export-md-btn">Export as Markdown (.md)</button>
                <button id="export-txt-btn">Export as Text (.txt)</button>
                <button id="export-json-btn">Export JSON Backup</button>
              </div>
            </div>
            <button id="delete-note-btn" class="btn btn-danger btn-sm" title="Delete Note">🗑️</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Settings & Sync Modal -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Sync & Storage Settings</h3>
        <button id="settings-close-btn" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body">
        <section class="settings-section">
          <h4>1. Chrome Storage Mode</h4>
          <p class="settings-desc">Choose how notes are stored locally inside Chrome.</p>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="storage-mode" value="local" checked>
              <div>
                <strong>Local Storage (`chrome.storage.local`)</strong>
                <span class="radio-sub">Fastest, unlimited local storage on this computer.</span>
              </div>
            </label>
            <label class="radio-label">
              <input type="radio" name="storage-mode" value="sync">
              <div>
                <strong>Chrome Account Sync (`chrome.storage.sync`)</strong>
                <span class="radio-sub">Automatically mirrors notes across your logged-in Chrome browsers.</span>
              </div>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h4>2. GitHub Gist Cloud Sync</h4>
          <p class="settings-desc">Sync notes with a private GitHub Gist for cross-browser backup.</p>

          <div class="form-group">
            <label for="gist-pat-input">GitHub Personal Access Token (gasp/pat):</label>
            <input type="password" id="gist-pat-input" placeholder="ghp_xxxxxxxxxxxx..." autocomplete="off">
            <span class="field-hint">Requires <code>gist</code> permission on GitHub.</span>
          </div>

          <div class="form-group">
            <label for="gist-id-input">Gist ID (Optional):</label>
            <input type="text" id="gist-id-input" placeholder="Auto-generated upon first push...">
          </div>

          <div class="sync-actions">
            <button id="gist-push-btn" class="btn btn-accent btn-sm">⬆️ Push to Cloud Gist</button>
            <button id="gist-pull-btn" class="btn btn-secondary btn-sm">⬇️ Pull from Cloud Gist</button>
          </div>

          <div id="gist-sync-status" class="sync-status">Status: Not connected</div>
        </section>
      </div>
      <div class="modal-footer">
        <button id="settings-save-btn" class="btn btn-primary btn-sm">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input for JSON Import -->
  <input type="file" id="import-file-input" accept=".json" style="display:none">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="sidepanel.js"></script>
</body>

</html>
